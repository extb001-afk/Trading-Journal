# 개발 도구 설정(ruff·mypy) — 봇 실행·시험과 무관(둘 다 표준 라이브러리만 · 시험 = python3 tests/run_all.py).
# CI(.github/workflows/tests.yml 의 lint 잡)만 ruff·mypy 를 설치해 돌린다. 판 고정은 그 잡에 있다.
# 단계: 1) F(미정의 이름·미사용 import 등)+E9(문법) · 2) B006·B008·B904·PLW0603 — 지금 · mypy 는 0 오류 파일만 하나씩 추가.
#   B904 = raise … from <잡은 예외> · 일부러 안 붙인 자리(evm_synth.rpc_deferred 가 __cause__ 로 판정 — 붙이면 동작이 바뀜)는 그 줄 noqa+이유.
#   B006·B008·PLW0603 = 일부러 쓴 자리(함수 메모·람다 값 묶기·모듈 상태)는 그 줄 noqa+이유 — 새 자리는 이유 없이 못 들어온다.
#   B007(안 쓰는 반복 변수 180곳)은 버그 신호가 아니라 이름 바꾸기 잡음이라 켜지 않음.

[tool.ruff]
line-length = 140
target-version = "py39"   # README 약속 = Python 3.9+

[tool.ruff.lint]
select = ["F", "E9", "B006", "B008", "B904", "PLW0603"]

[tool.mypy]
# 3.9 를 대상으로 못 두는 이유: 최신 mypy(2.x)는 python_version 3.10 미만을 지원하지 않는다 — 3.9 전용 문법 차이는 CI 의 3.9 시험 잡이 잡는다.
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
follow_imports = "silent"
# 0 오류 파일만(늘릴 때 = 그 파일 0 오류 확인 후 한 줄씩 · 힌트·cast 만으로 0 · 동작 무변)
files = [
    "src/accounting_basis.py",
    "src/accounting_cp.py",
    "src/accounting_krw.py",
    "src/accounting_fee.py",
    "src/accounting_fs.py",
    "src/accounting_loan.py",
    "src/accounting_lp.py",
    "src/accounting_outmove.py",
    "src/accounting_unk.py",
    "src/accounting_util.py",
    "src/view_common.py",
    "src/calcguard.py",
    "src/fsio.py",
]
